<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placar NFL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0C1C15; --panel:#132A20; --panel-alt:#1B392A; --line:rgba(243,241,231,.12);
  --chalk:#F3F1E7; --muted:#8FA396; --amber:#E3A23B; --amber-ink:#241804;
  --good:#4FB37A; --bad:#DE645A; --pending:#6C7F73;
  --header-grad-start:#0F241A; --header-grad-end:#0C1C15;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.theme-hihihi{
  --bg:#050505; --panel:#131313; --panel-alt:#1e1e1e; --line:rgba(255,255,255,.16);
  --chalk:#FFFFFF; --muted:#a6a6a6; --amber:#F7941D; --amber-ink:#1a0d00;
  --header-grad-start:#161616; --header-grad-end:#050505;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%; overflow-x:hidden;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--chalk); overflow-x:hidden;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column;
}
.display{font-family:'Oswald',Impact,'Arial Narrow',sans-serif;}
header{
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-left,0px)) 0;
  background:linear-gradient(180deg,var(--header-grad-start) 0%,var(--header-grad-end) 100%);
  color:var(--chalk); position:sticky; top:0; z-index:10;
  border-bottom:2px solid var(--line);
}
h1{
  font-size:1.25rem; margin:0 0 12px 0; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--chalk);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
h1 .ball{flex:0 0 auto; display:block;}
.hash{
  height:6px; margin:0 calc(-16px - env(safe-area-inset-left,0px)) 10px; background-image:repeating-linear-gradient(
    90deg, transparent, transparent 22px, rgba(227,162,59,.35) 22px, rgba(227,162,59,.35) 24px
  );
  opacity:.6;
}
.weekbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px;}
.weekbar button{
  flex:0 0 auto; padding:7px 13px; border-radius:3px; border:1px solid var(--line);
  background:transparent; color:var(--muted); font-size:.78rem; cursor:pointer;
  font-family:'Oswald',sans-serif; letter-spacing:.02em;
}
.weekbar button.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber); font-weight:600;}
.boardbar{display:flex; gap:18px; overflow-x:auto; padding-bottom:10px; margin-top:2px;}
.boardbar button{
  flex:0 0 auto; background:none; border:none; color:var(--muted); cursor:pointer;
  font-family:'Inter',sans-serif; font-size:.82rem; font-weight:500; padding:4px 2px 8px;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.boardbar button.active{color:var(--chalk); border-bottom-color:var(--amber); font-weight:600;}
main{flex:1; overflow-y:auto; padding:16px calc(14px + env(safe-area-inset-left,0px)) 28px;}
.section-title{
  font-size:.72rem; font-weight:500; color:var(--muted);
  letter-spacing:.03em; margin:2px 2px 10px;
}
.section-title.season{margin-top:26px; padding-top:16px; border-top:1px solid var(--line);}
.scoreboard{
  display:flex; align-items:baseline; gap:0; margin-bottom:18px;
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 4px;
}
.sb-stat{flex:1; text-align:center; position:relative;}
.sb-stat + .sb-stat{border-left:1px solid var(--line);}
.sb-stat b{
  display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:1.7rem;
  font-variant-numeric:tabular-nums; line-height:1;
}
.sb-stat span{font-size:.68rem; color:var(--muted); display:block; margin-top:4px;}
.sb-stat.good b{color:var(--good);}
.sb-stat.bad b{color:var(--bad);}
.sb-stat.pct b{color:var(--amber);}
.games-list{display:flex; flex-direction:column; gap:8px;}
.game-card{
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 8px;
}
.matchup-row{display:flex; align-items:center; gap:6px;}
.pick-rect{
  flex:1; min-width:0; display:flex; align-items:center; gap:6px;
  border:1px solid var(--line); border-radius:5px; padding:8px 8px; cursor:pointer;
  background:transparent; color:var(--chalk);
}
.pick-rect.home{flex-direction:row-reverse; text-align:right;}
.pick-rect.picked{background:var(--amber); border-color:var(--amber);}
.pick-rect .team-name{
  color:inherit; font-size:.8rem; font-weight:500; min-width:0; flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Inter',sans-serif;
}
.pick-rect.home .team-name{text-align:right;}
.pick-rect .team-name.tbd{color:var(--muted); font-weight:400;}
.pick-rect.picked .team-name{color:var(--amber-ink); font-weight:600;}
.pick-rect .team-name-input{
  border:none; background:transparent; color:inherit; font-size:.8rem; font-weight:500;
  padding:0; min-width:0; width:100%; font-family:'Inter',sans-serif;
}
.pick-rect.home .team-name-input{text-align:right;}
.pick-rect .team-name-input::placeholder{color:var(--muted);}
.pick-rect.picked .team-name-input{color:var(--amber-ink); font-weight:600;}
.pick-rect.picked .team-name-input::placeholder{color:var(--amber-ink);}
.team-badge{
  flex:0 0 auto; width:26px; height:20px; border-radius:4px; display:none; align-items:center;
  justify-content:center; font-family:'Oswald',sans-serif; font-size:.6rem; font-weight:600;
  letter-spacing:.01em;
}
.result-toggle{
  flex:0 0 auto; width:32px; height:32px; border-radius:5px; border:1px solid var(--line);
  background:transparent; color:var(--pending); font-size:.9rem; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif;
  padding:0; margin:0 2px;
}
.result-toggle.correct{border-color:var(--good); background:rgba(79,179,122,.16); color:var(--good);}
.result-toggle.wrong{border-color:var(--bad); background:rgba(222,100,90,.16); color:var(--bad);}
.game-card.correct{border-color:var(--good);}
.game-card.wrong{border-color:var(--bad);}
.empty{color:var(--muted); text-align:center; padding:32px 10px; font-size:.85rem;}
.standings{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.division{
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;
}
.division-title{
  font-family:'Oswald',sans-serif; font-size:.72rem; font-weight:600; color:var(--muted);
  letter-spacing:.03em; margin-bottom:8px; text-transform:uppercase;
}
.division-row{display:flex; align-items:center; gap:6px; padding:5px 4px; margin:0 -4px; border-radius:5px; cursor:pointer;}
.division-row:hover,.division-row:focus-visible{background:var(--panel-alt); outline:none;}
.division-row .team-badge{display:inline-flex;}
.division-team-name{flex:1; min-width:0; font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.division-record{font-family:'Oswald',sans-serif; font-size:.78rem; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums;}
.section-hint{font-weight:400; opacity:.8;}
.sheet-backdrop{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6);
  display:none; align-items:flex-end; justify-content:center;
}
.sheet-backdrop.open{display:flex;}
.sheet{
  width:100%; max-width:560px; max-height:86%; display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line); border-bottom:none;
  border-radius:14px 14px 0 0; padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:640px){
  .sheet-backdrop{align-items:center;}
  .sheet{border-radius:14px; border-bottom:1px solid var(--line); max-height:80vh;}
}
.sheet-head{display:flex; align-items:center; gap:10px; padding:14px 14px 8px;}
.sheet-head .team-badge{width:40px; height:30px; font-size:.78rem; border-radius:5px;}
.sheet-titles{flex:1; min-width:0;}
.sheet-title{
  font-family:'Oswald',sans-serif; font-size:1.15rem; font-weight:600;
  letter-spacing:.02em; text-transform:uppercase;
}
.sheet-record{font-size:.74rem; color:var(--muted); margin-top:2px;}
.sheet-close{
  flex:0 0 auto; width:34px; height:34px; border-radius:6px; border:1px solid var(--line);
  background:transparent; color:var(--chalk); font-size:1.1rem; cursor:pointer; padding:0;
}
.sheet-hint{font-size:.68rem; color:var(--muted); padding:0 14px 10px;}
.sheet-list{overflow-y:auto; border-top:1px solid var(--line);}
.hist-row{
  display:flex; align-items:center; gap:8px; padding:9px 14px;
  border-bottom:1px solid var(--line); font-size:.82rem;
}
.hist-row:last-child{border-bottom:none;}
.hist-row.link{cursor:pointer;}
.hist-row.link:hover{background:var(--panel-alt);}
.hist-week{flex:0 0 82px; color:var(--muted); font-family:'Oswald',sans-serif; font-size:.74rem;}
.hist-ha{flex:0 0 20px; color:var(--muted); font-size:.72rem; text-align:right;}
.hist-opp{flex:1; min-width:0; display:flex; align-items:center; gap:6px;}
.hist-opp-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hist-row.bye .hist-opp-name{color:var(--muted); font-style:italic;}
.hist-res{
  flex:0 0 28px; height:24px; border-radius:5px; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-size:.78rem; font-weight:600; color:var(--pending);
}
.hist-res.win{border-color:var(--good); background:rgba(79,179,122,.16); color:var(--good);}
.hist-res.loss{border-color:var(--bad); background:rgba(222,100,90,.16); color:var(--bad);}
.share-row{display:flex; justify-content:center; margin-top:20px;}
.share-btn{
  background:var(--amber); color:var(--amber-ink); border:none; border-radius:6px;
  padding:10px 18px; font-size:.82rem; font-weight:600; cursor:pointer;
  font-family:'Inter',sans-serif;
}
.share-btn:disabled{opacity:.6; cursor:default;}
#captureArea{background:var(--bg); padding:2px;}
.capture-heading{
  display:none; font-family:'Oswald',sans-serif; font-size:1rem; font-weight:600;
  color:var(--chalk); text-align:center; margin-bottom:12px; letter-spacing:.02em;
}
#captureArea.capturing .capture-heading{display:block;}
</style>
</head>

<header>
  <h1><svg class="ball" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="12" cy="12" rx="10" ry="7" transform="rotate(-30 12 12)" fill="var(--amber)"/><path d="M7 9.5L17 14.5M8.5 8L9.5 9.5M15.5 14.5L14.5 16M6.5 11L8 12M16 12L17.5 13" stroke="var(--amber-ink)" stroke-width="1" stroke-linecap="round"/></svg>NFL Temporada 2026/27</h1>
  <div class="hash"></div>
  <div class="boardbar" id="boardbar"></div>
  <div class="weekbar" id="weekbar"></div>
</header>
<main>
  <div id="captureArea">
    <div class="capture-heading" id="captureHeading"></div>
    <div class="section-title" id="weekStatsTitle">Estatísticas da semana</div>
    <div class="scoreboard" id="statsWeek"></div>
    <div class="games-list" id="gamesBody"></div>
  </div>
  <div class="section-title season">Estatísticas da temporada inteira</div>
  <div class="scoreboard" id="statsSeason"></div>
  <div class="share-row">
    <button id="shareBtn" class="share-btn">📤 Baixar imagem dos palpites</button>
  </div>
  <div class="section-title season">Classificação por divisão <span class="section-hint">· toque num time para ver o histórico</span></div>
  <div class="standings" id="standingsBody"></div>
</main>

<div class="sheet-backdrop" id="teamSheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span class="team-badge" id="sheetBadge"></span>
      <div class="sheet-titles">
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-record" id="sheetRecord"></div>
      </div>
      <button class="sheet-close" id="sheetClose" aria-label="Fechar">✕</button>
    </div>
    <div class="sheet-hint">@ = jogo fora · vs = jogo em casa · V/D = vitória/derrota · toque no adversário para abrir o histórico dele</div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

function setBadge(el, teamName){
  const key = (teamName||"").trim().toLowerCase();
  const meta = TEAM_META[key];
  if(!meta){ el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "inline-flex";
  el.textContent = meta[0];
  el.style.background = meta[1];

const TEAM_DIVISIONS = [
  ["AFC Leste", ["patriots","bills","dolphins","jets"]],
  ["AFC Norte", ["ravens","bengals","browns","steelers"]],
  ["AFC Sul", ["texans","colts","jaguars","titans"]],
  ["AFC Oeste", ["broncos","chiefs","raiders","chargers"]],
  ["NFC Leste", ["cowboys","eagles","giants","commanders"]],
  ["NFC Norte", ["bears","lions","packers","vikings"]],
  ["NFC Sul", ["falcons","panthers","saints","buccaneers"]],
  ["NFC Oeste", ["cardinals","rams","49ers","seahawks"]]
];
const TEAM_DISPLAY_NAME = {
  "patriots":"Patriots","bills":"Bills","dolphins":"Dolphins","jets":"Jets",
  "ravens":"Ravens","bengals":"Bengals","browns":"Browns","steelers":"Steelers",
  "texans":"Texans","colts":"Colts","jaguars":"Jaguars","titans":"Titans",
  "broncos":"Broncos","chiefs":"Chiefs","raiders":"Raiders","chargers":"Chargers",
  "cowboys":"Cowboys","eagles":"Eagles","giants":"Giants","commanders":"Commanders",
  "bears":"Bears","lions":"Lions","packers":"Packers","vikings":"Vikings",
  "falcons":"Falcons","panthers":"Panthers","saints":"Saints","buccaneers":"Buccaneers",
  "cardinals":"Cardinals","rams":"Rams","49ers":"49ers","seahawks":"Seahawks"
};

function emptyPicks(){ return {}; }

function ensureBoards(){
  BOARD_DEFS.forEach(b=>{
    if(!state.boards[b.id]) state.boards[b.id] = {picks: emptyPicks()};
  });
  if(!state.currentBoard || !state.boards[state.currentBoard]){
    state.currentBoard = BOARD_DEFS[0].id;
  }
  if(!state.results) state.results = {};
}

function ensurePlayoffSchedule(){
  const hasPlayoffs = state.schedule.some(g=>g.week >= 19);
  if(!hasPlayoffs){
    const extra = SEED_DATA_V4.schedule.filter(g=>g.week >= 19);
    state.schedule = state.schedule.concat(extra);
  }
}

function migrateFromV2(oldRaw){
  const old = JSON.parse(oldRaw);
  const schedule = old.games.map(g=>({id:g.id, week:g.week, teamA:g.teamA, teamB:g.teamB}));
  const pessoalPicks = {};
  old.games.forEach(g=>{
    pessoalPicks[g.id] = {pickWinner: g.pickWinner, resultStatus: g.resultStatus};
  });
  return {
    version: 3,
    currentBoard: "pessoal",
    currentWeek: old.currentWeek || 1,
    schedule: schedule,
    boards: {
      pessoal: {picks: pessoalPicks},
      ludio_andre: {picks: {}},
      hihihi: {picks: {}}
    }
  };
}

function migrateV3toV4(old){
  const results = {};
  const order = ["pessoal","ludio_andre","hihihi"];
  order.forEach(bid=>{
    const b = old.boards && old.boards[bid];
    if(!b) return;
    Object.keys(b.picks||{}).forEach(gid=>{
      if(results[gid]) return;
      const p = b.picks[gid];
      if(!p || !p.resultStatus || !p.pickWinner) return;
      if(p.resultStatus === "correct") results[gid] = p.pickWinner;
      else if(p.resultStatus === "wrong") results[gid] = p.pickWinner === "teamA" ? "teamB" : "teamA";
    });
  });
  const boards = {};
  order.forEach(bid=>{
    const b = old.boards && old.boards[bid];
    const picks = {};
    if(b) Object.keys(b.picks||{}).forEach(gid=>{
      const pw = (b.picks[gid]||{}).pickWinner;
      if(pw) picks[gid] = pw;
    });
    boards[bid] = {picks: picks};
  });
  return {
    version: 4,
    currentBoard: old.currentBoard || "pessoal",
    currentWeek: old.currentWeek || 1,
    schedule: old.schedule,
    results: results,
    boards: boards
  };
}

function load(){
  try{
    const rawV4 = localStorage.getItem(STORAGE_KEY_V4);
    if(rawV4) return JSON.parse(rawV4);
    const rawV3 = localStorage.getItem(STORAGE_KEY_V3);
    if(rawV3) return migrateV3toV4(JSON.parse(rawV3));
    const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
    if(rawV2) return migrateV3toV4(migrateFromV2(rawV2));
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED_DATA_V4));
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY_V4, JSON.stringify(state)); }catch(e){}
}

let state = load();
ensureBoards();
ensurePlayoffSchedule();
save();

function board(){ return state.boards[state.currentBoard]; }
function getPick(gameId){
  return board().picks[gameId] || null;
}
function setPick(gameId, winnerOrNull){
  if(winnerOrNull) board().picks[gameId] = winnerOrNull;
  else delete board().picks[gameId];
  save();
}
function getResult(gameId){
  return state.results[gameId] || null;
}
function setResult(gameId, winnerOrNull){
  if(winnerOrNull) state.results[gameId] = winnerOrNull;
  else delete state.results[gameId];
  save();
}
function derivedStatus(gameId){
  const result = getResult(gameId);
  if(!result) return null;
  const pick = getPick(gameId);
  if(!pick) return null;
  return pick === result ? "correct" : "wrong";
}

function weeksInUse(){
  const set = new Set(state.schedule.map(g=>g.week));
  set.add(state.currentWeek);
  return Array.from(set).sort((a,b)=>a-b);
}

function renderBoardbar(){
  document.body.classList.toggle("theme-hihihi", state.currentBoard === "hihihi");
  const bar = document.getElementById("boardbar");
  bar.innerHTML = "";
  BOARD_DEFS.forEach(b=>{
    const btn = document.createElement("button");
    btn.textContent = b.label;
    if(b.id === state.currentBoard) btn.classList.add("active");
    btn.onclick = ()=>{ state.currentBoard = b.id; save(); renderAll(); };
    bar.appendChild(btn);
  });
}

function renderWeekbar(){
  const bar = document.getElementById("weekbar");
  bar.innerHTML = "";
  weeksInUse().forEach(w=>{
    const b = document.createElement("button");
    b.textContent = weekLabel(w);
    if(w === state.currentWeek) b.classList.add("active");
    b.onclick = ()=>{ state.currentWeek = w; save(); renderAll(); };
    bar.appendChild(b);
  });
}

function currentGames(){
  return state.schedule.filter(g=>g.week === state.currentWeek);
}

function statLine(gameList){
  let correct = 0, wrong = 0;
  gameList.forEach(g=>{
    const st = derivedStatus(g.id);
    if(st === "correct") correct++;
    else if(st === "wrong") wrong++;
  });
  const decided = correct + wrong;
  const pct = decided ? Math.round((correct/decided)*100) : 0;
  return {correct, wrong, pct};
}

function renderStats(){
  document.getElementById("weekStatsTitle").textContent = "Estatísticas — " + weekLabel(state.currentWeek);
  const weekBox = document.getElementById("statsWeek");
  const w = statLine(currentGames());
  weekBox.innerHTML = `
    <div class="sb-stat good"><b>${w.correct}</b><span>Acertos</span></div>
    <div class="sb-stat bad"><b>${w.wrong}</b><span>Erros</span></div>
    <div class="sb-stat pct"><b>${w.pct}%</b><span>Aproveitamento</span></div>
  `;

  const seasonBox = document.getElementById("statsSeason");
  const s = statLine(state.schedule);
  seasonBox.innerHTML = `
    <div class="sb-stat good"><b>${s.correct}</b><span>Acertos</span></div>
    <div class="sb-stat bad"><b>${s.wrong}</b><span>Erros</span></div>
    <div class="sb-stat pct"><b>${s.pct}%</b><span>Aproveitamento</span></div>
  `;
}

function renderGames(){
  const body = document.getElementById("gamesBody");
  const games = currentGames();
  body.innerHTML = "";
  if(games.length === 0){
    body.innerHTML = `<div class="empty">Nenhum jogo cadastrado nesta semana ainda.</div>`;
    return;
  }
  games.forEach(g=>{
    const myPick = getPick(g.id);
    const result = getResult(g.id);
    const status = derivedStatus(g.id);
    const card = document.createElement("div");
    card.className = "game-card";
    if(status === "correct") card.classList.add("correct");
    else if(status === "wrong") card.classList.add("wrong");

    const row = document.createElement("div");
    row.className = "matchup-row";

    const rectA = document.createElement("div");
    rectA.className = "pick-rect away";
    if(myPick === "teamA") rectA.classList.add("picked");
    rectA.innerHTML = `<span class="team-badge"></span>${g.week >= 19 ? `<input class="team-name-input" value="${escapeAttr(g.teamA)}" placeholder="Visitante">` : `<span class="team-name${g.teamA ? '' : ' tbd'}">${escapeAttr(g.teamA) || "A definir"}</span>`}`;
    const badgeA = rectA.querySelector(".team-badge");
    setBadge(badgeA, g.teamA);
    const inputA = rectA.querySelector("input");
    if(inputA){
      inputA.oninput = (e)=>{ g.teamA = e.target.value; save(); setBadge(badgeA, g.teamA); };
      inputA.onclick = (e)=>{ e.stopPropagation(); };
    }
    rectA.onclick = ()=>{ setPick(g.id, myPick === "teamA" ? null : "teamA"); renderGames(); };
    row.appendChild(rectA);

    const resultBtn = document.createElement("button");
    resultBtn.className = "result-toggle" + (status === "correct" ? " correct" : status === "wrong" ? " wrong" : "");
    resultBtn.textContent = status === "correct" ? "✓" : status === "wrong" ? "✗" : "–";
    resultBtn.title = "Toque para marcar quem venceu de verdade";
    resultBtn.onclick = ()=>{
      const next = result === null ? "teamA" : result === "teamA" ? "teamB" : null;
      setResult(g.id, next);
      renderAll();
    };
    row.appendChild(resultBtn);

    const rectB = document.createElement("div");
    rectB.className = "pick-rect home";
    if(myPick === "teamB") rectB.classList.add("picked");
    rectB.innerHTML = `<span class="team-badge"></span>${g.week >= 19 ? `<input class="team-name-input" value="${escapeAttr(g.teamB)}" placeholder="Mandante">` : `<span class="team-name${g.teamB ? '' : ' tbd'}">${escapeAttr(g.teamB) || "A definir"}</span>`}`;
    const badgeB = rectB.querySelector(".team-badge");
    setBadge(badgeB, g.teamB);
    const inputB = rectB.querySelector("input");
    if(inputB){
      inputB.oninput = (e)=>{ g.teamB = e.target.value; save(); setBadge(badgeB, g.teamB); };
      inputB.onclick = (e)=>{ e.stopPropagation(); };
    }
    rectB.onclick = ()=>{ setPick(g.id, myPick === "teamB" ? null : "teamB"); renderGames(); };
    row.appendChild(rectB);

    card.appendChild(row);
    body.appendChild(card);
  });
}

function gameWinner(gameId){ return state.results[gameId] || null; }

function computeStandings(){
  const record = {};
  state.schedule.forEach(g=>{
    if(g.week > 18) return;
    const result = gameWinner(g.id);
    if(!result) return;
    const winnerName = result === "teamA" ? g.teamA : g.teamB;
    const loserName = result === "teamA" ? g.teamB : g.teamA;
    const wKey = (winnerName||"").trim().toLowerCase();
    const lKey = (loserName||"").trim().toLowerCase();
    if(!wKey || !lKey) return;
    if(!record[wKey]) record[wKey] = {w:0,l:0};
    if(!record[lKey]) record[lKey] = {w:0,l:0};
    record[wKey].w++;
    record[lKey].l++;
  });
  return record;
}

function renderStandings(){
  const box = document.getElementById("standingsBody");
  if(!box) return;
  const record = computeStandings();
  box.innerHTML = "";
  TEAM_DIVISIONS.forEach(([divName, teamKeys])=>{
    const divBox = document.createElement("div");
    divBox.className = "division";
    const title = document.createElement("div");
    title.className = "division-title";
    title.textContent = divName;
    divBox.appendChild(title);

    const rows = teamKeys.map(key=>{
      const rec = record[key] || {w:0,l:0};
      return {key, w: rec.w, l: rec.l};
    }).sort((a,b)=> b.w - a.w || a.l - b.l);

    rows.forEach(r=>{
      const rowEl = document.createElement("div");
      rowEl.className = "division-row";
      rowEl.tabIndex = 0;
      rowEl.setAttribute("role","button");
      rowEl.onclick = ()=>openTeam(r.key);
      rowEl.onkeydown = (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); openTeam(r.key); } };
      const badge = document.createElement("span");
      badge.className = "team-badge";
      setBadge(badge, TEAM_DISPLAY_NAME[r.key] || r.key);
      rowEl.appendChild(badge);
      const name = document.createElement("span");
      name.className = "division-team-name";
      name.textContent = TEAM_DISPLAY_NAME[r.key] || r.key;
      rowEl.appendChild(name);
      const rec = document.createElement("span");
      rec.className = "division-record";
      rec.textContent = r.w + "-" + r.l;
      rowEl.appendChild(rec);
      divBox.appendChild(rowEl);
    });

    box.appendChild(divBox);
  });
}

/* ---------- Histórico do time (aba ao clicar na classificação) ---------- */
function teamKeyOf(n){ return (n||"").trim().toLowerCase(); }

function buildTeamRows(key){
  const mine = state.schedule.filter(g=> teamKeyOf(g.teamA)===key || teamKeyOf(g.teamB)===key);
  const info = g=>{
    const away = teamKeyOf(g.teamA)===key;
    const oppRaw = away ? g.teamB : g.teamA;
    const winner = gameWinner(g.id);
    const res = winner ? (((winner==="teamA")===away) ? "V" : "D") : null;
    return {week:g.week, away:away, oppRaw:oppRaw, oppKey:teamKeyOf(oppRaw), res:res};
  };
  const rows = [];
  for(let w=1; w<=18; w++){
    const g = mine.find(x=>x.week===w);
    rows.push(g ? info(g) : {week:w, bye:true});
  }
  mine.filter(g=>g.week>18).sort((a,b)=>a.week-b.week).forEach(g=>rows.push(info(g)));
  return rows;
}

function openTeam(key){
  const sheet = document.getElementById("teamSheet");
  const display = TEAM_DISPLAY_NAME[key] || key;
  const rec = computeStandings()[key] || {w:0,l:0};
  setBadge(document.getElementById("sheetBadge"), display);
  document.getElementById("sheetTitle").textContent = display;
  document.getElementById("sheetRecord").textContent = "Temporada regular: " + rec.w + "-" + rec.l;

  const list = document.getElementById("sheetList");
  list.innerHTML = "";
  buildTeamRows(key).forEach(r=>{
    const row = document.createElement("div");
    row.className = "hist-row";

    const wk = document.createElement("span");
    wk.className = "hist-week";
    wk.textContent = weekLabel(r.week);
    row.appendChild(wk);

    const ha = document.createElement("span");
    ha.className = "hist-ha";
    row.appendChild(ha);

    const opp = document.createElement("span");
    opp.className = "hist-opp";
    const name = document.createElement("span");
    name.className = "hist-opp-name";

    const res = document.createElement("span");
    res.className = "hist-res";

    if(r.bye){
      row.classList.add("bye");
      name.textContent = "Folga";
      opp.appendChild(name);
      res.textContent = "";
      res.style.visibility = "hidden";
    } else {
      ha.textContent = r.away ? "@" : "vs";
      const badge = document.createElement("span");
      badge.className = "team-badge";
      setBadge(badge, r.oppRaw);
      opp.appendChild(badge);
      name.textContent = TEAM_DISPLAY_NAME[r.oppKey] || (r.oppRaw||"").trim() || "A definir";
      opp.appendChild(name);
      if(r.res === "V"){ res.textContent = "V"; res.classList.add("win"); }
      else if(r.res === "D"){ res.textContent = "D"; res.classList.add("loss"); }
      else { res.textContent = "–"; }
      if(TEAM_DISPLAY_NAME[r.oppKey]){
        row.classList.add("link");
        row.onclick = ()=>openTeam(r.oppKey);
      }
    }
    row.appendChild(opp);
    row.appendChild(res);
    list.appendChild(row);
  });
  list.scrollTop = 0;

  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden","false");
  document.getElementById("sheetClose").focus();
}

function closeTeam(){
  const sheet = document.getElementById("teamSheet");
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden","true");
}
document.getElementById("sheetClose").onclick = closeTeam;
document.getElementById("teamSheet").addEventListener("click", e=>{
  if(e.target.id === "teamSheet") closeTeam();
});
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeTeam();
});

function escapeAttr(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderAll(){
  renderBoardbar();
  renderWeekbar();
  renderStats();
  renderGames();
  renderStandings();
}
renderAll();

document.getElementById("shareBtn").onclick = function(){
  const btn = this;
  const boardLabel = (BOARD_DEFS.find(b=>b.id===state.currentBoard) || {}).label || "";
  const heading = document.getElementById("captureHeading");
  heading.textContent = "NFL Temporada 2026/27 — " + boardLabel + " — " + weekLabel(state.currentWeek);
  const area = document.getElementById("captureArea");
  area.classList.add("capturing");
  btn.disabled = true;
  btn.textContent = "Gerando imagem...";
  const bg = getComputedStyle(document.body).backgroundColor;
  html2canvas(area, {backgroundColor: bg, scale: 2}).then(function(canvas){
    area.classList.remove("capturing");
    btn.disabled = false;
    btn.textContent = "📤 Baixar imagem dos palpites";
    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "palpites-" + state.currentBoard + "-semana" + state.currentWeek + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }).catch(function(){
    area.classList.remove("capturing");
    btn.disabled = false;
    btn.textContent = "📤 Baixar imagem dos palpites";
    alert("Não foi possível gerar a imagem. Tente novamente.");
  });
};
