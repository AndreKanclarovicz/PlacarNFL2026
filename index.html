<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placar NFL 2026</title>
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --navy:#0A1F39; --navy2:#12335c;
  --colhead:#D1E7F5; --teamcell:#E8F2F7; --border:#c9d6e0; --text:#14202b; --muted:#5c6d7c;
  --good:#1a8a3e; --bad:#c0392b; --pending:#8a97a3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --colhead:#1c3350; --teamcell:#182531;
    --border:#2a323c; --text:#eef2f6; --muted:#93a0ac;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --colhead:#1c3350; --teamcell:#182531;
  --border:#2a323c; --text:#eef2f6; --muted:#93a0ac;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column;
}
header{
  padding:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-left,0px)) 10px;
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:10;
}
h1{font-size:1.15rem; margin:0 0 10px 0; font-weight:700; letter-spacing:.2px;}
.weekbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.weekbar button{
  flex:0 0 auto; padding:6px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08); color:#fff; font-size:.8rem; cursor:pointer;
}
.weekbar button.active{background:#fff; color:var(--navy); border-color:#fff; font-weight:700;}
main{flex:1; overflow-y:auto; padding:12px calc(10px + env(safe-area-inset-left,0px)) 24px;}
.section-title{
  font-size:.78rem; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.03em; margin:4px 2px 8px;
}
.section-title.season{margin-top:18px;}
.stats{display:flex; gap:8px; margin-bottom:12px;}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:8px 10px; flex:1; text-align:center;
}
.stat b{display:block; font-size:1.05rem;}
.stat span{font-size:.68rem; color:var(--muted);}
.table-wrap{
  overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface);
}
table{border-collapse:collapse; width:100%; min-width:520px;}
thead th{
  background:var(--colhead); color:var(--text); font-size:.75rem; font-weight:700;
  text-align:left; padding:8px 10px; position:sticky; top:0; white-space:nowrap;
  border-bottom:1px solid var(--border);
}
tbody td{
  padding:7px 10px; font-size:.85rem; border-bottom:1px solid var(--border); vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
td.team{background:var(--teamcell);}
td.team input{
  width:100%; border:none; background:transparent; color:var(--text); font-size:.85rem; padding:2px 0;
}
td.team input:focus{outline:1px solid var(--navy2); border-radius:4px;}
.pick-chips{display:flex; gap:4px;}
.pick-chips button{
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:6px; padding:5px 7px; font-size:.72rem; cursor:pointer; white-space:nowrap;
}
.pick-chips button.picked{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;}
.result-badge{
  border:none; background:transparent; cursor:pointer; font-size:.78rem; font-weight:700;
  padding:5px 6px; border-radius:6px; white-space:nowrap;
}
.result-badge.correct{color:var(--good);}
.result-badge.wrong{color:var(--bad);}
.result-badge.pending{color:var(--pending); font-weight:500;}
.remove{background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; padding:2px 6px;}
.add-row{
  display:flex; justify-content:center; padding:10px;
}
.add-row button{
  background:var(--navy); color:#fff; border:none; border-radius:8px;
  padding:8px 16px; font-size:.82rem; cursor:pointer; font-weight:600;
}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:.85rem;}
</style>
</head>
<body>
<header>
  <h1>🏆 Placar NFL 2026</h1>
  <div class="weekbar" id="weekbar"></div>
</header>
<main>

    </table>
  </div>
  <div class="section-title season">📊 Estatísticas da Temporada</div>

</main>

}

function renderStats(){
  document.getElementById("weekStatsTitle").textContent = "Estatísticas da Semana " + state.currentWeek;
  const weekBox = document.getElementById("statsWeek");
  const w = statLine(currentGames());
  weekBox.innerHTML = `
    <div class="stat"><b>${w.correct}</b><span>Acertos</span></div>
    <div class="stat"><b>${w.wrong}</b><span>Erros</span></div>
    <div class="stat"><b>${w.pct}%</b><span>% Acerto</span></div>
  `;

  const seasonBox = document.getElementById("statsSeason");
  const s = statLine(state.games);
  seasonBox.innerHTML = `
    <div class="stat"><b>${s.correct}</b><span>Acertos</span></div>
    <div class="stat"><b>${s.wrong}</b><span>Erros</span></div>
    <div class="stat"><b>${s.pct}%</b><span>% Acerto</span></div>
  `;
}

function badgeInfo(status){
  if(status === "correct") return {cls:"correct", label:"✅ ACERTO"};
  if(status === "wrong") return {cls:"wrong", label:"❌ ERRO"};
  return {cls:"pending", label:"— Pendente"};
}

function renderGames(){
  const body = document.getElementById("gamesBody");
  const games = currentGames();
  body.innerHTML = "";
  if(games.length === 0){
    body.innerHTML = `<tr><td colspan="5"><div class="empty">Nenhum jogo cadastrado nesta semana ainda.</div></td></tr>`;
    return;
  }
  games.forEach(g=>{
    const tr = document.createElement("tr");

    const tdA = document.createElement("td");
    tdA.className = "team";
    tdA.innerHTML = `<input value="${escapeAttr(g.teamA)}" placeholder="Time A">`;
    tdA.querySelector("input").oninput = (e)=>{ g.teamA = e.target.value; save(); renderGames(); };
    tr.appendChild(tdA);

    const tdB = document.createElement("td");
    tdB.className = "team";
    tdB.innerHTML = `<input value="${escapeAttr(g.teamB)}" placeholder="Time B">`;
    tdB.querySelector("input").oninput = (e)=>{ g.teamB = e.target.value; save(); renderGames(); };
    tr.appendChild(tdB);

    const tdPick = document.createElement("td");
    const chips = document.createElement("div");
    chips.className = "pick-chips";
    ["teamA","teamB"].forEach(key=>{
      const btn = document.createElement("button");
      btn.textContent = g[key] || (key==="teamA" ? "Time A" : "Time B");
      if(g.pickWinner === key) btn.classList.add("picked");
      btn.onclick = ()=>{ g.pickWinner = key; save(); renderGames(); };
      chips.appendChild(btn);
    });
    tdPick.appendChild(chips);
    tr.appendChild(tdPick);

    const tdResult = document.createElement("td");
    const info = badgeInfo(g.resultStatus);
    const rbtn = document.createElement("button");
    rbtn.className = "result-badge " + info.cls;
    rbtn.textContent = info.label;
    rbtn.title = "Toque para alternar: Pendente → Acerto → Erro";
    rbtn.onclick = ()=>{
      g.resultStatus = g.resultStatus === null ? "correct" : g.resultStatus === "correct" ? "wrong" : null;
      save(); renderAll();
    };
    tdResult.appendChild(rbtn);
    tr.appendChild(tdResult);

    const tdRemove = document.createElement("td");
    const rm = document.createElement("button");
    rm.className = "remove";
    rm.textContent = "✕";
    rm.onclick = ()=>{ state.games = state.games.filter(x=>x.id!==g.id); save(); renderAll(); };
    tdRemove.appendChild(rm);
    tr.appendChild(tdRemove);

    body.appendChild(tr);
  });
}

function escapeAttr(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function addGame(){
  const maxId = state.games.reduce((m,g)=>{
    const n = parseInt((g.id||"g0").slice(1),10);
    return isNaN(n) ? m : Math.max(m,n);
  }, 0);
  state.games.push({
    id: "g" + (maxId+1),
    week: state.currentWeek,
    teamA: "", teamB: "",
    pickWinner: null,
    resultStatus: null
  });
  save(); renderAll();
}
function renderAll(){
  renderWeekbar();
  renderStats();
  renderGames();
}
renderAll();
</script>
</body>
</html>
