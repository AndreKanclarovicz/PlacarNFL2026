<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placar NFL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0C1C15; --panel:#132A20; --panel-alt:#1B392A; --line:rgba(243,241,231,.12);
  --chalk:#F3F1E7; --muted:#8FA396; --amber:#E3A23B; --amber-ink:#241804;
  --good:#4FB37A; --bad:#DE645A; --pending:#6C7F73;
  --header-grad-start:#0F241A; --header-grad-end:#0C1C15;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.theme-hihihi{
  --bg:#050505; --panel:#131313; --panel-alt:#1e1e1e; --line:rgba(255,255,255,.16);
  --chalk:#FFFFFF; --muted:#a6a6a6; --amber:#F7941D; --amber-ink:#1a0d00;
  --header-grad-start:#161616; --header-grad-end:#050505;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%; overflow-x:hidden;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--chalk); overflow-x:hidden;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column;
}
.display{font-family:'Oswald',Impact,'Arial Narrow',sans-serif;}
header{
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-left,0px)) 0;
  background:linear-gradient(180deg,var(--header-grad-start) 0%,var(--header-grad-end) 100%);
  color:var(--chalk); position:sticky; top:0; z-index:10;
  border-bottom:2px solid var(--line);
}
h1{
  font-size:1.25rem; margin:0 0 12px 0; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--chalk);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
h1 .ball{flex:0 0 auto; display:block;}
.hash{
  height:6px; margin:0 calc(-16px - env(safe-area-inset-left,0px)) 10px; background-image:repeating-linear-gradient(
    90deg, transparent, transparent 22px, rgba(227,162,59,.35) 22px, rgba(227,162,59,.35) 24px
  );
  opacity:.6;
}
.weekbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px;}
.weekbar button{
  flex:0 0 auto; padding:7px 13px; border-radius:3px; border:1px solid var(--line);
  background:transparent; color:var(--muted); font-size:.78rem; cursor:pointer;
  font-family:'Oswald',sans-serif; letter-spacing:.02em;
}
.weekbar button.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber); font-weight:600;}
.boardbar{display:flex; gap:18px; overflow-x:auto; padding-bottom:10px; margin-top:2px;}
.boardbar button{
  flex:0 0 auto; background:none; border:none; color:var(--muted); cursor:pointer;
  font-family:'Inter',sans-serif; font-size:.82rem; font-weight:500; padding:4px 2px 8px;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.boardbar button.active{color:var(--chalk); border-bottom-color:var(--amber); font-weight:600;}
main{flex:1; overflow-y:auto; padding:16px calc(14px + env(safe-area-inset-left,0px)) 28px;}
.section-title{
  font-size:.72rem; font-weight:500; color:var(--muted);
  letter-spacing:.03em; margin:2px 2px 10px;
}
.section-title.season{margin-top:26px; padding-top:16px; border-top:1px solid var(--line);}
.scoreboard{
  display:flex; align-items:baseline; gap:0; margin-bottom:18px;
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 4px;
}
.sb-stat{flex:1; text-align:center; position:relative;}
.sb-stat + .sb-stat::before{
  content:""; position:absolute; left:0; top:15%; bottom:15%; width:1px; background:var(--line);
}
.sb-stat b{
  display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:1.7rem;
  font-variant-numeric:tabular-nums; line-height:1;
}
.sb-stat span{font-size:.68rem; color:var(--muted); display:block; margin-top:4px;}
.sb-stat.good b{color:var(--good);}
.sb-stat.bad b{color:var(--bad);}
.sb-stat.pct b{color:var(--amber);}
.table-wrap{
  overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:var(--panel);
}
table{border-collapse:collapse; width:100%; min-width:540px;}
thead th{
  background:var(--panel-alt); color:var(--muted); font-size:.7rem; font-weight:500;
  text-align:left; padding:10px 12px; position:sticky; top:0; white-space:nowrap;
  border-bottom:1px solid var(--line); letter-spacing:.02em;
}
tbody td{
  padding:9px 12px; font-size:.86rem; border-bottom:1px solid var(--line); vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even) td.team{background:rgba(255,255,255,.02);}
td.team input{
  width:100%; border:none; background:transparent; color:var(--chalk); font-size:.86rem; padding:3px 0;
  font-family:'Inter',sans-serif; min-width:0;
}
.team-cell{display:flex; align-items:center; gap:8px;}
.team-badge{
  flex:0 0 auto; width:26px; height:20px; border-radius:4px; display:none; align-items:center;
  justify-content:center; font-family:'Oswald',sans-serif; font-size:.62rem; font-weight:600;
  letter-spacing:.01em;
}
td.team input::placeholder{color:var(--muted);}
td.team input:focus{outline:none; border-bottom:1px solid var(--amber);}
.pick-chips{display:flex; gap:5px;}
.pick-chips button{
  border:1px solid var(--line); background:transparent; color:var(--muted);
  border-radius:3px; padding:6px 9px; font-size:.72rem; cursor:pointer; white-space:nowrap;
  font-family:'Inter',sans-serif;
}
.pick-chips button.picked{background:var(--amber); border-color:var(--amber); color:var(--amber-ink); font-weight:600;}
.result-badge{
  border:none; background:transparent; cursor:pointer; font-size:.78rem; font-weight:500;
  padding:5px 10px; border-radius:3px; white-space:nowrap; font-family:'Inter',sans-serif;
}
.result-badge.correct{color:var(--good); background:rgba(79,179,122,.12);}
.result-badge.wrong{color:var(--bad); background:rgba(222,100,90,.12);}
.result-badge.pending{color:var(--pending); font-weight:400;}
.remove{background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; padding:2px 6px;}
.empty{color:var(--muted); text-align:center; padding:32px 10px; font-size:.85rem;}
.share-row{display:flex; justify-content:center; margin-top:20px;}
.share-btn{
  background:var(--amber); color:var(--amber-ink); border:none; border-radius:6px;
  padding:10px 18px; font-size:.82rem; font-weight:600; cursor:pointer;
  font-family:'Inter',sans-serif;
}
.share-btn:disabled{opacity:.6; cursor:default;}
#captureArea{background:var(--bg); padding:2px;}
.capture-heading{
  display:none; font-family:'Oswald',sans-serif; font-size:1rem; font-weight:600;
  color:var(--chalk); text-align:center; margin-bottom:12px; letter-spacing:.02em;
}
#captureArea.capturing .capture-heading{display:block;}
#captureArea.capturing .table-wrap{overflow-x:visible;}
#captureArea.capturing table{width:auto;}
#captureArea.capturing .table-wrap{overflow:visible;}
</style>
</head>
<body>
<header>
  <h1><svg class="ball" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="12" cy="12" rx="10" ry="7" transform="rotate(-30 12 12)" fill="var(--amber)"/><path d="M7 9.5L17 14.5M8.5 8L9.5 9.5M15.5 14.5L14.5 16M6.5 11L8 12M16 12L17.5 13" stroke="var(--amber-ink)" stroke-width="1" stroke-linecap="round"/></svg>NFL Temporada 2026/27</h1>
  <div class="hash"></div>
  <div class="boardbar" id="boardbar"></div>
  <div class="weekbar" id="weekbar"></div>
</header>
<main>
  <div id="captureArea">
    <div class="capture-heading" id="captureHeading"></div>
    <div class="section-title" id="weekStatsTitle">Estatísticas da semana</div>
    <div class="scoreboard" id="statsWeek"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Visitante</th>
            <th>Mandante</th>
            <th>Meu palpite</th>
            <th>Resultado</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>
  </div>
  <div class="section-title season">Estatísticas da temporada inteira</div>
  <div class="scoreboard" id="statsSeason"></div>
  <div class="share-row">
    <button id="shareBtn" class="share-btn">📤 Baixar imagem dos palpites</button>
  </div>
</main>

const BOARD_DEFS = [

  {id:"hihihi", label:"HIHIHI"}

function weekLabel(w){
  return WEEK_LABELS[w] || ("Sem " + w);
}

  "patriots":["NE","#002244","#C60C30"], "seahawks":["SEA","#002244","#69BE28"],
  "49ers":["SF","#AA0000","#B3995D"], "rams":["LAR","#003594","#FFA300"],

  "broncos":["DEN","#FB4F14","#002244"], "chiefs":["KC","#E31837","#FFB612"]
};
function setBadge(el, teamName){
  const key = (teamName||"").trim().toLowerCase();
  const meta = TEAM_META[key];
  if(!meta){ el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "inline-flex";
  el.textContent = meta[0];
  el.style.background = meta[1];
  el.style.color = meta[2];
}

function emptyPicks(){ return {}; }

function ensureBoards(){
  BOARD_DEFS.forEach(b=>{
    if(!state.boards[b.id]) state.boards[b.id] = {picks: emptyPicks()};
  });
  if(!state.currentBoard || !state.boards[state.currentBoard]){
    state.currentBoard = BOARD_DEFS[0].id;
  }
}

function ensurePlayoffSchedule(){
  const hasPlayoffs = state.schedule.some(g=>g.week >= 19);
  if(!hasPlayoffs){
    const extra = SEED_DATA_V3.schedule.filter(g=>g.week >= 19);
    state.schedule = state.schedule.concat(extra);
  }
}

function migrateFromV2(oldRaw){
  const old = JSON.parse(oldRaw);
  const schedule = old.games.map(g=>({id:g.id, week:g.week, teamA:g.teamA, teamB:g.teamB}));
  const pessoalPicks = {};
  old.games.forEach(g=>{
    pessoalPicks[g.id] = {pickWinner: g.pickWinner, resultStatus: g.resultStatus};
  });
  return {
    version: 3,
    currentBoard: "pessoal",
    currentWeek: old.currentWeek || 1,
    schedule: schedule,
    boards: {
      pessoal: {picks: pessoalPicks},
      ludio_andre: {picks: {}},
      hihihi: {picks: {}}
    }
  };
}

function load(){
  try{
    const rawV3 = localStorage.getItem(STORAGE_KEY_V3);
    if(rawV3) return JSON.parse(rawV3);
    const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
    if(rawV2) return migrateFromV2(rawV2);
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED_DATA_V3));
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY_V3, JSON.stringify(state)); }catch(e){}
}

let state = load();
ensureBoards();
ensurePlayoffSchedule();
save();

function board(){ return state.boards[state.currentBoard]; }
function getPick(gameId){
  return board().picks[gameId] || {pickWinner:null, resultStatus:null};
}
function setPick(gameId, patch){
  const cur = board().picks[gameId] || {pickWinner:null, resultStatus:null};
  board().picks[gameId] = Object.assign({}, cur, patch);
  save();
}

function weeksInUse(){
  const set = new Set(state.schedule.map(g=>g.week));
  set.add(state.currentWeek);
  return Array.from(set).sort((a,b)=>a-b);
}

function renderBoardbar(){
  document.body.classList.toggle("theme-hihihi", state.currentBoard === "hihihi");
  const bar = document.getElementById("boardbar");
  bar.innerHTML = "";
  BOARD_DEFS.forEach(b=>{
    const btn = document.createElement("button");
    btn.textContent = b.label;
    if(b.id === state.currentBoard) btn.classList.add("active");
    btn.onclick = ()=>{ state.currentBoard = b.id; save(); renderAll(); };
    bar.appendChild(btn);
  });
}

function renderWeekbar(){
  const bar = document.getElementById("weekbar");
  bar.innerHTML = "";
  weeksInUse().forEach(w=>{
    const b = document.createElement("button");
    b.textContent = weekLabel(w);
    if(w === state.currentWeek) b.classList.add("active");
    b.onclick = ()=>{ state.currentWeek = w; save(); renderAll(); };
    bar.appendChild(b);
  });
}

function currentGames(){
  return state.schedule.filter(g=>g.week === state.currentWeek);
}

function statLine(gameList){
  const picks = board().picks;
  let correct = 0, wrong = 0;
  gameList.forEach(g=>{
    const p = picks[g.id];
    if(p && p.resultStatus === "correct") correct++;
    else if(p && p.resultStatus === "wrong") wrong++;
  });
  const decided = correct + wrong;
  const pct = decided ? Math.round((correct/decided)*100) : 0;
  return {correct, wrong, pct};
}

function renderStats(){
  document.getElementById("weekStatsTitle").textContent = "Estatísticas — " + weekLabel(state.currentWeek);
  const weekBox = document.getElementById("statsWeek");
  const w = statLine(currentGames());
  weekBox.innerHTML = `
    <div class="sb-stat good"><b>${w.correct}</b><span>Acertos</span></div>
    <div class="sb-stat bad"><b>${w.wrong}</b><span>Erros</span></div>
    <div class="sb-stat pct"><b>${w.pct}%</b><span>Aproveitamento</span></div>
  `;

  const seasonBox = document.getElementById("statsSeason");
  const s = statLine(state.schedule);
  seasonBox.innerHTML = `
    <div class="sb-stat good"><b>${s.correct}</b><span>Acertos</span></div>
    <div class="sb-stat bad"><b>${s.wrong}</b><span>Erros</span></div>
    <div class="sb-stat pct"><b>${s.pct}%</b><span>Aproveitamento</span></div>
  `;
}

function badgeInfo(status){
  if(status === "correct") return {cls:"correct", label:"Acerto"};
  if(status === "wrong") return {cls:"wrong", label:"Erro"};
  return {cls:"pending", label:"— Pendente"};
}

function renderGames(){
  const body = document.getElementById("gamesBody");
  const games = currentGames();
  body.innerHTML = "";
  if(games.length === 0){
    body.innerHTML = `<tr><td colspan="4"><div class="empty">Nenhum jogo cadastrado nesta semana ainda.</div></td></tr>`;
    return;
  }
  games.forEach(g=>{
    const pick = getPick(g.id);
    const tr = document.createElement("tr");

    const tdA = document.createElement("td");
    tdA.className = "team";
    tdA.innerHTML = `<div class="team-cell"><span class="team-badge" id="badgeA"></span><input value="${escapeAttr(g.teamA)}" placeholder="Time A"></div>`;
    const badgeA = tdA.querySelector(".team-badge");
    setBadge(badgeA, g.teamA);
    tdA.querySelector("input").oninput = (e)=>{
      g.teamA = e.target.value; save();
      chipBtnA.textContent = g.teamA || "Time A";
      setBadge(badgeA, g.teamA);
    };
    tr.appendChild(tdA);

    const tdB = document.createElement("td");
    tdB.className = "team";
    tdB.innerHTML = `<div class="team-cell"><span class="team-badge" id="badgeB"></span><input value="${escapeAttr(g.teamB)}" placeholder="Time B"></div>`;
    const badgeB = tdB.querySelector(".team-badge");
    setBadge(badgeB, g.teamB);
    tdB.querySelector("input").oninput = (e)=>{
      g.teamB = e.target.value; save();
      chipBtnB.textContent = g.teamB || "Time B";
      setBadge(badgeB, g.teamB);
    };
    tr.appendChild(tdB);

    const tdPick = document.createElement("td");
    const chips = document.createElement("div");
    chips.className = "pick-chips";
    const chipBtnA = document.createElement("button");
    chipBtnA.textContent = g.teamA || "Time A";
    if(pick.pickWinner === "teamA") chipBtnA.classList.add("picked");
    chipBtnA.onclick = ()=>{ setPick(g.id, {pickWinner: pick.pickWinner === "teamA" ? null : "teamA"}); renderGames(); };
    chips.appendChild(chipBtnA);
    const chipBtnB = document.createElement("button");
    chipBtnB.textContent = g.teamB || "Time B";
    if(pick.pickWinner === "teamB") chipBtnB.classList.add("picked");
    chipBtnB.onclick = ()=>{ setPick(g.id, {pickWinner: pick.pickWinner === "teamB" ? null : "teamB"}); renderGames(); };
    chips.appendChild(chipBtnB);
    tdPick.appendChild(chips);
    tr.appendChild(tdPick);

    const tdResult = document.createElement("td");
    const info = badgeInfo(pick.resultStatus);
    const rbtn = document.createElement("button");
    rbtn.className = "result-badge " + info.cls;
    rbtn.textContent = info.label;
    rbtn.title = "Toque para alternar: Pendente → Acerto → Erro";
    rbtn.onclick = ()=>{
      const next = pick.resultStatus === null ? "correct" : pick.resultStatus === "correct" ? "wrong" : null;
      setPick(g.id, {resultStatus: next});
      renderAll();
    };
    tdResult.appendChild(rbtn);
    tr.appendChild(tdResult);

    body.appendChild(tr);
  });
}

function escapeAttr(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderAll(){
  renderBoardbar();
  renderWeekbar();
  renderStats();
  renderGames();
}
renderAll();

document.getElementById("shareBtn").onclick = function(){
  const btn = this;
  const boardLabel = (BOARD_DEFS.find(b=>b.id===state.currentBoard) || {}).label || "";
  const heading = document.getElementById("captureHeading");
  heading.textContent = "NFL Temporada 2026/27 — " + boardLabel + " — " + weekLabel(state.currentWeek);
  const area = document.getElementById("captureArea");
  area.classList.add("capturing");
  btn.disabled = true;
  btn.textContent = "Gerando imagem...";
  const bg = getComputedStyle(document.body).backgroundColor;
  html2canvas(area, {backgroundColor: bg, scale: 2, windowWidth: 760, width: area.scrollWidth}).then(function(canvas){
    area.classList.remove("capturing");
    btn.disabled = false;
    btn.textContent = "📤 Baixar imagem dos palpites";
    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "palpites-" + state.currentBoard + "-semana" + state.currentWeek + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }).catch(function(){
    area.classList.remove("capturing");
    btn.disabled = false;
    btn.textContent = "📤 Baixar imagem dos palpites";
    alert("Não foi possível gerar a imagem. Tente novamente.");
  });
};
